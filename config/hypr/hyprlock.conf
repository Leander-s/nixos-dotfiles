background {
    path = ~/.local/state/hyprpaper/current
    blur_size = 2
    blur_passes = 2
	vibrancy = 0.1696
}

input-field {
    size = 300, 60
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.2
    fade_on_empty = true
    placeholder_text = Password
    position = 0, 0
    halign = center
    valign = center
    inner_color = rgba(0,0,0,0.4)
    font_color = rgba(255,255,255,1.0)
    fail_color = rgba(255,0,0,0.6)
    capslock_color = rgba(255,255,0,0.6)
    rounding = 8
}

